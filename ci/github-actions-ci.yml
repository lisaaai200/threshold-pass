# To enable: move this file to .github/workflows/ci.yml (needs a token with `workflow` scope).
# It installs the official Compact toolchain, compiles the contract (with keys), runs the tests
# and deploys the demo to GitHub Pages.
name: CI (compile Compact, test, deploy Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  COMPACT_CLI_VERSION: 0.5.3
  COMPACT_COMPILER_VERSION: 0.35.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install the official Compact toolchain
        run: |
          set -euo pipefail
          base=https://github.com/midnightntwrk/compact/releases/download/compact-v${COMPACT_CLI_VERSION}
          curl -sSLO "$base/compact-x86_64-unknown-linux-musl.tar.xz"
          curl -sSLO "$base/compact-x86_64-unknown-linux-musl.tar.xz.sha256"
          echo "$(cut -d' ' -f1 compact-x86_64-unknown-linux-musl.tar.xz.sha256)  compact-x86_64-unknown-linux-musl.tar.xz" | sha256sum -c -
          tar xf compact-x86_64-unknown-linux-musl.tar.xz
          mkdir -p "$HOME/.local/bin" && mv compact-x86_64-unknown-linux-musl/compact "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update "$COMPACT_COMPILER_VERSION"
      - name: Compiler version
        run: compact --version && compact compile --version && compact compile --language-version
      - run: npm ci
      - name: Compile Compact contract (full, with proving/verifier keys)
        run: |
          npm run compact
          ls -la contract/src/managed/threshold_pass/keys contract/src/managed/threshold_pass/zkir
      - run: npm run typecheck
      - name: Contract tests (compiled circuits on simulated ledger)
        run: npm test
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
